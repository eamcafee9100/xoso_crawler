<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập liệu Xổ số</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #d62d20;
        }
        .btn-submit {
            background-color: #d62d20;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #b8251a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container bg-white">
            <h2 class="header">PHÂN TÍCH XỔ SỐ</h2>
            
            <form method="POST" action="/analyze">
                <!-- Loại xổ số -->
                <div class="mb-3">
                    <label for="lotteryType" class="form-label">Loại xổ số</label>
                    <select class="form-select" id="lotteryType" name="lottery_type" required>
                        <option value="" selected disabled>Chọn loại xổ số</option>
                        <option value="6/55">6/55</option>
                        <option value="6/45">6/45</option>
                        <option value="4/40">4/40</option>
                        <option value="3D">3D</option>
                    </select>
                </div>
                
                <!-- Phương pháp phân tích -->
                <div class="mb-3">
                    <label class="form-label">Phương pháp phân tích</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="analysis_method" id="method1" value="statistical" checked>
                        <label class="form-check-label" for="method1">
                            Phân tích thống kê
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="analysis_method" id="method2" value="shap">
                        <label class="form-check-label" for="method2">
                            Phân tích SHAP (Machine Learning)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="analysis_method" id="method3" value="optimization">
                        <label class="form-check-label" for="method3">
                            Tối ưu hóa xác suất
                        </label>
                    </div>
                </div>
                
                <!-- Dữ liệu lịch sử -->
                <div class="mb-3">
                    <label for="historyData" class="form-label">Dữ liệu lịch sử (tùy chọn)</label>
                    <textarea class="form-control" id="historyData" name="history_data" rows="4" 
                              placeholder="Nhập các kết quả
