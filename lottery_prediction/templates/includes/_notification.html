{% for message in messages %}
<div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header bg-{{ message.tags }}">
        <strong class="me-auto text-white">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
        {{ message }}
    </div>
</div>
{% endfor %}

<div id="ajaxNotification" class="toast align-items-center text-white bg-success border-0" 
     role="alert" aria-live="assertive" aria-atomic="true" style="display: none;">
    <div class="d-flex">
        <div class="toast-body" id="ajaxNotificationMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" 
                data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
</div>
