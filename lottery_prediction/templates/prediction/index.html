{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h2 class="h5 mb-0">Generate Predictions</h2>
        </div>
        <div class="card-body">
          <form id="predictionForm">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-4">
                <label for="predictionDate" class="form-label">Date</label>
                <input type="date" class="form-control" id="predictionDate" 
                       value="{{ default_date|date:'Y-m-d' }}" required>
              </div>
              <div class="col-md-3">
                <label for="modelType" class="form-label">Model Type</label>
                <select class="form-select" id="modelType" required>
                  <option value="gradient_boosting">Gradient Boosting</option>
                  <option value="hist_gradient_boosting">Hist Gradient Boosting</option>
                  <option value="ensemble">Ensemble</option>
                  <option value="frequency_based">Frequency Based</option>
                  <option value="day_of_week">Day of Week</option>
                  <option value="cyclical">Cyclical</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="topK" class="form-label">Top Results</label>
                <input type="number" class="form-control" id="topK" 
                       min="1" max="50" value="10" required>
              </div>
              <div class="col-md-3">
                <label for="predictionContext" class="form-label">Mode</label>
                <select class="form-select" id="predictionContext" required>
                  <option value="prediction">Real Prediction</option>
                  <option value="evaluation">Historical Test</option>
                </select>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn btn-primary">
                Generate
              </button>
              <small class="text-muted ms-3">
                <i class="fas fa-info-circle"></i> 
                Choose "Historical Test" to evaluate past predictions
              </small>
            </div>
          </form>
        </div>
      </div>

      <div id="resultsSection" class="d-none">
        <div class="card shadow-sm">
          <div class="card-header bg-light">
            <h3 class="h6 mb-0">Prediction Results</h3>
          </div>
          <div class="card-body">
            <!-- Results Table -->
            <div class="row">
              <div class="col-md-6">
                <div class="table-responsive">
                  <table id="predictionTable" class="table table-striped table-hover">
                    <thead class="table-light">
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
              
              <!-- Chart -->
              <div class="col-md-6">
                <canvas id="probabilityChart" width="400" height="300"></canvas>
              </div>
            </div>
            
            <!-- Model Info and Data Quality -->
            <div class="row mt-4">
              <div class="col-md-6">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title">Model Information</h5>
                    <ul class="list-group list-group-flush" id="modelInfoList">
                      <!-- Filled by JavaScript -->
                    </ul>
                  </div>
                </div>
              </div>
              <div class="col-md-6" id="dataQualityContainer">
                <!-- Filled by JavaScript -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/prediction.js' %}"></script>
{% endblock %}
