<div class="table-responsive">
  <table id="predictionTable" class="table table-striped table-hover">
    <thead class="table-light">
      <tr>
        <th>Rank</th>
        <th>Number</th>
        <th>Probability</th>
        <th>Confidence</th>
      </tr>
    </thead>
    <tbody>
      <!-- Filled by JavaScript -->
    </tbody>
  </table>
</div>

<div class="mt-4">
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Model Info</h5>
          <ul class="list-group list-group-flush" id="modelInfoList">
            <!-- Filled by JavaScript -->
          </ul>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <canvas id="probabilityChart"></canvas>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Historical comparison section -->
  <div class="row mt-4" id="historicalComparison" style="display: none;">
    <div class="col-12">
      <div class="card border-info">
        <div class="card-header bg-info text-white">
          <h5 class="card-title mb-0">Historical Accuracy Check</h5>
        </div>
        <div class="card-body">
          <div id="actualResults"></div>
          <div id="accuracyMetrics" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>
