<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fix Test</title>
</head>
<body>
    <h1>Testing JavaScript TypeError Fix</h1>
    
    <div id="results"></div>
    
    <script>
        // Simulate the safeToFixed function that was added to fix the error
        function safeToFixed(value, decimals = 3) {
            if (value == null || value === undefined) {
                return '0.' + '0'.repeat(decimals);
            }
            
            const numValue = typeof value === 'string' ? parseFloat(value) : value;
            
            if (isNaN(numValue) || !isFinite(numValue)) {
                return '0.' + '0'.repeat(decimals);
            }
            
            return numValue.toFixed(decimals);
        }
        
        // Test cases that were causing the original error
        const testCases = [
            { name: 'Normal number', value: 0.756 },
            { name: 'Null value', value: null },
            { name: 'Undefined value', value: undefined },
            { name: 'String number', value: "0.892" },
            { name: 'Invalid string', value: "invalid" },
            { name: 'Object', value: { foo: 'bar' } },
            { name: 'Array', value: [1, 2, 3] },
            { name: 'Zero', value: 0 },
            { name: 'Negative', value: -0.345 }
        ];
        
        let results = '<h2>Test Results:</h2>';
        let allPassed = true;
        
        testCases.forEach((testCase, index) => {
            try {
                const result = safeToFixed(testCase.value, 3);
                results += `<p style="color: green;">✅ ${testCase.name}: ${testCase.value} → ${result}</p>`;
            } catch (error) {
                results += `<p style="color: red;">❌ ${testCase.name}: ${testCase.value} → ERROR: ${error.message}</p>`;
                allPassed = false;
            }
        });
        
        if (allPassed) {
            results += '<h3 style="color: green;">🎉 ALL TESTS PASSED! The JavaScript TypeError fix is working.</h3>';
        } else {
            results += '<h3 style="color: red;">❌ Some tests failed.</h3>';
        }
        
        // Simulate the original problematic code
        results += '<h2>Original Problematic Code Simulation:</h2>';
        
        const mockInsights = {
            information_entropy: 0.756,
            quantum_entanglement_score: null,  // This was causing the error
            consciousness_level: undefined,    // This was also problematic
            time_crystal_strength: "0.445"     // String numbers were also an issue
        };
        
        try {
            // OLD CODE (would cause errors):
            // const entropy = mockInsights.information_entropy?.toFixed(3) || '0.000';
            // const quantum = mockInsights.quantum_entanglement_score?.toFixed(3) || '0.000'; // ERROR!
            
            // NEW CODE (fixed):
            const entropy = safeToFixed(mockInsights.information_entropy, 3);
            const quantum = safeToFixed(mockInsights.quantum_entanglement_score, 3);
            const consciousness = safeToFixed(mockInsights.consciousness_level, 3);
            const crystalStrength = safeToFixed(mockInsights.time_crystal_strength, 3);
            
            results += `<p>✅ Information Entropy: ${entropy}</p>`;
            results += `<p>✅ Quantum Entanglement: ${quantum}</p>`;
            results += `<p>✅ Consciousness Level: ${consciousness}</p>`;
            results += `<p>✅ Time Crystal Strength: ${crystalStrength}</p>`;
            
            results += '<p style="color: green; font-weight: bold;">🎉 Revolutionary insights display fixed!</p>';
            
        } catch (error) {
            results += `<p style="color: red;">❌ Revolutionary insights still have errors: ${error.message}</p>`;
        }
        
        document.getElementById('results').innerHTML = results;
    </script>
</body>
</html>
