<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runner - loadMethodAnalysis Function</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Test Styles -->
    <style>
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .test-result {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
        
        .test-pass {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .test-fail {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .test-pending {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        
        .test-suite-header {
            background-color: #e9ecef;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .progress-container {
            margin: 20px 0;
        }
        
        .log-container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .btn-group {
            margin: 20px 0;
        }
        
        .mock-status {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .error-details {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">🧪 Test Suite: loadMethodAnalysis Function</h1>
                
                <!-- Control Panel -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Test Controls</h5>
                    </div>
                    <div class="card-body">
                        <div class="btn-group mb-3" role="group">
                            <button type="button" class="btn btn-primary" onclick="runAllTests()">
                                🚀 Run All Tests
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="runPhaseTests('validation')">
                                📋 Input Validation
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="runPhaseTests('api')">
                                🌐 API Call Setup
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="runPhaseTests('response')">
                                📡 Response Validation
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="runPhaseTests('data')">
                                📊 Data Processing
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="runPhaseTests('error')">
                                ❌ Error Handling
                            </button>
                        </div>
                        
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-info" onclick="clearResults()">
                                🧹 Clear Results
                            </button>
                            <button type="button" class="btn btn-warning" onclick="resetMocks()">
                                🔄 Reset Mocks
                            </button>
                            <button type="button" class="btn btn-success" onclick="exportResults()">
                                📊 Export Results
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress" style="height: 20px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                            0%
                        </div>
                    </div>
                </div>
                
                <!-- Statistics -->
                <div class="stats-container">
                    <div class="stat-card">
                        <div id="totalTests" class="stat-number text-primary">0</div>
                        <div class="stat-label">Total Tests</div>
                    </div>
                    <div class="stat-card">
                        <div id="passedTests" class="stat-number text-success">0</div>
                        <div class="stat-label">Passed</div>
                    </div>
                    <div class="stat-card">
                        <div id="failedTests" class="stat-number text-danger">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat-card">
                        <div id="testDuration" class="stat-number text-info">0ms</div>
                        <div class="stat-label">Duration</div>
                    </div>
                </div>
                
                <!-- Mock Status -->
                <div class="mock-status">
                    <h6>Mock Status</h6>
                    <div id="mockStatus">Mocks not initialized</div>
                </div>
                
                <!-- Test Results -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Test Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="testResults"></div>
                    </div>
                </div>
                
                <!-- Console Log -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">Console Output</h5>
                    </div>
                    <div class="card-body">
                        <div id="consoleLog" class="log-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Implementation -->
    <script>
        // ✅ TEST RUNNER IMPLEMENTATION FOR BROWSER
        
        // Global test state
        let testStats = {
            total: 0,
            passed: 0,
            failed: 0,
            pending: 0,
            startTime: 0,
            endTime: 0
        };
        
        let testResults = [];
        let mockObjects = {};
        
        // Initialize browser test environment
        function initializeTestEnvironment() {
            // Create mock functions
            mockObjects = {
                showError: createMockFunction('showError'),
                showLoading: createMockFunction('showLoading'),
                hideLoading: createMockFunction('hideLoading'),
                renderAnalysisResults: createMockFunction('renderAnalysisResults'),
                console: {
                    log: createMockFunction('console.log'),
                    error: createMockFunction('console.error')
                },
                document: {
                    getElementById: createMockFunction('document.getElementById')
                },
                fetch: createMockFunction('fetch')
            };
            
            // Setup global mocks
            window.showError = mockObjects.showError;
            window.showLoading = mockObjects.showLoading;
            window.hideLoading = mockObjects.hideLoading;
            window.renderAnalysisResults = mockObjects.renderAnalysisResults;
            window.fetch = mockObjects.fetch;
            
            // Global test variables
            window.currentAnalysisDate = null;
            window.lowRiskMethodsData = [];
            
            updateMockStatus();
            logToConsole('✅ Test environment initialized');
        }
        
        function createMockFunction(name) {
            const mock = function(...args) {
                mock.calls.push(args);
                mock.callCount++;
                logToConsole(`📞 Mock call: ${name}(${args.map(arg => JSON.stringify(arg)).join(', ')})`);
                
                // Return promises for async functions
                if (name === 'fetch') {
                    return mock.mockReturnValue || Promise.resolve(createMockResponse());
                }
                
                return mock.mockReturnValue;
            };
            
            mock.calls = [];
            mock.callCount = 0;
            mock.mockReturnValue = undefined;
            mock.mockResolvedValue = function(value) {
                mock.mockReturnValue = Promise.resolve(value);
                return mock;
            };
            mock.mockRejectedValue = function(error) {
                mock.mockReturnValue = Promise.reject(error);
                return mock;
            };
            mock.reset = function() {
                mock.calls = [];
                mock.callCount = 0;
                mock.mockReturnValue = undefined;
            };
            
            return mock;
        }
        
        function createMockResponse(options = {}) {
            return {
                ok: options.ok !== undefined ? options.ok : true,
                status: options.status || 200,
                statusText: options.statusText || 'OK',
                url: options.url || 'http://test-url.com',
                headers: {
                    get: function(key) {
                        if (key === 'content-type') {
                            return options.contentType || 'application/json';
                        }
                        return null;
                    }
                },
                json: function() {
                    return Promise.resolve(options.jsonData || { success: true });
                }
            };
        }
        
        // Test implementation
        function loadMethodAnalysis() {
            const dateInput = document.getElementById('analysisDatePicker');
            const analysisDate = dateInput ? dateInput.value : '';
            
            if (!analysisDate) {
                showError('Vui lòng chọn ngày phân tích');
                return;
            }
            
            currentAnalysisDate = analysisDate;
            showLoading();
            
            const apiUrl = `/pre-lokhung/api/method-analysis-v2/?analysis_date=${analysisDate}&limit=15`;
            console.log('🔍 Calling API:', apiUrl);
            
            return fetch(apiUrl)
                .then(response => {
                    console.log('📡 Response status:', response.status);
                    console.log('📡 Response URL:', response.url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error(`Expected JSON but got: ${contentType}`);
                    }
                    
                    return response.json();
                })
                .then(data => {
                    hideLoading();
                    
                    if (!data || typeof data !== 'object') {
                        throw new Error('Invalid response format');
                    }
                    
                    if (data.success) {
                        renderAnalysisResults(data);
                    } else {
                        showError(data.error || 'Lỗi không xác định');
                    }
                })
                .catch(error => {
                    hideLoading();
                    
                    let errorMessage = 'Lỗi kết nối';
                    
                    if (error.name === 'SyntaxError') {
                        errorMessage = 'Lỗi định dạng dữ liệu từ server';
                    } else if (error.message.includes('HTTP 404')) {
                        errorMessage = 'API không tồn tại - Kiểm tra URL routing';
                    } else if (error.message.includes('HTTP 500')) {
                        errorMessage = 'Lỗi server nội bộ';
                    } else if (error.message.includes('Failed to fetch')) {
                        errorMessage = 'Không thể kết nối đến server';
                    } else {
                        errorMessage = error.message;
                    }
                    
                    showError(errorMessage);
                    console.error('Analysis API Error:', error);
                    throw error; // Re-throw for test catching
                });
        }
        
        // Test definitions
        const testSuites = {
            validation: {
                name: 'Phase 1: Input Validation',
                tests: [
                    {
                        name: 'Should show error when date input is empty',
                        test: function() {
                            // Setup
                            resetMocks();
                            mockObjects.document.getElementById.mockReturnValue = { value: '' };
                            
                            // Execute
                            loadMethodAnalysis();
                            
                            // Assert
                            assert(mockObjects.showError.callCount === 1, 'showError should be called once');
                            assert(mockObjects.showError.calls[0][0] === 'Vui lòng chọn ngày phân tích', 'Error message should match');
                            assert(mockObjects.showLoading.callCount === 0, 'showLoading should not be called');
                            assert(mockObjects.fetch.callCount === 0, 'fetch should not be called');
                        }
                    },
                    {
                        name: 'Should proceed when valid date is provided',
                        test: async function() {
                            // Setup
                            resetMocks();
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockResolvedValue(createMockResponse());
                            
                            // Execute
                            await loadMethodAnalysis();
                            
                            // Assert
                            assert(mockObjects.showError.callCount === 0, 'showError should not be called');
                            assert(mockObjects.showLoading.callCount === 1, 'showLoading should be called once');
                            assert(mockObjects.fetch.callCount === 1, 'fetch should be called once');
                            assert(window.currentAnalysisDate === '2025-07-31', 'currentAnalysisDate should be set');
                        }
                    }
                ]
            },
            
            api: {
                name: 'Phase 2: API Call Setup',
                tests: [
                    {
                        name: 'Should construct correct API URL',
                        test: async function() {
                            // Setup
                            resetMocks();
                            const testDate = '2025-07-31';
                            mockObjects.document.getElementById.mockReturnValue = { value: testDate };
                            mockObjects.fetch.mockResolvedValue(createMockResponse());
                            
                            // Execute
                            await loadMethodAnalysis();
                            
                            // Assert
                            const expectedUrl = `/pre-lokhung/api/method-analysis-v2/?analysis_date=${testDate}&limit=15`;
                            assert(mockObjects.fetch.calls[0][0] === expectedUrl, 'API URL should be correct');
                        }
                    }
                ]
            },
            
            response: {
                name: 'Phase 3: Response Validation',
                tests: [
                    {
                        name: 'Should validate HTTP status code',
                        test: async function() {
                            // Setup
                            resetMocks();
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockResolvedValue(createMockResponse({ 
                                ok: false, 
                                status: 404, 
                                statusText: 'Not Found' 
                            }));
                            
                            // Execute & Assert
                            try {
                                await loadMethodAnalysis();
                                throw new Error('Should have thrown an error');
                            } catch (error) {
                                assert(error.message.includes('HTTP 404'), 'Should throw HTTP 404 error');
                                assert(mockObjects.hideLoading.callCount === 1, 'hideLoading should be called');
                            }
                        }
                    },
                    
                    {
                        name: 'Should validate content-type header',
                        test: async function() {
                            // Setup
                            resetMocks();
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockResolvedValue(createMockResponse({ 
                                contentType: 'text/html' 
                            }));
                            
                            // Execute & Assert
                            try {
                                await loadMethodAnalysis();
                                throw new Error('Should have thrown an error');
                            } catch (error) {
                                assert(error.message.includes('Expected JSON'), 'Should throw content-type error');
                            }
                        }
                    }
                ]
            },
            
            data: {
                name: 'Phase 4: Data Processing',
                tests: [
                    {
                        name: 'Should handle successful response',
                        test: async function() {
                            // Setup
                            resetMocks();
                            const successData = { success: true, data: {} };
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockResolvedValue(createMockResponse({ 
                                jsonData: successData 
                            }));
                            
                            // Execute
                            await loadMethodAnalysis();
                            
                            // Assert
                            assert(mockObjects.hideLoading.callCount === 1, 'hideLoading should be called');
                            assert(mockObjects.renderAnalysisResults.callCount === 1, 'renderAnalysisResults should be called');
                            assert(mockObjects.showError.callCount === 0, 'showError should not be called');
                        }
                    },
                    
                    {
                        name: 'Should handle API error response',
                        test: async function() {
                            // Setup
                            resetMocks();
                            const errorData = { success: false, error: 'Test error' };
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockResolvedValue(createMockResponse({ 
                                jsonData: errorData 
                            }));
                            
                            // Execute
                            await loadMethodAnalysis();
                            
                            // Assert
                            assert(mockObjects.hideLoading.callCount === 1, 'hideLoading should be called');
                            assert(mockObjects.showError.callCount === 1, 'showError should be called');
                            assert(mockObjects.showError.calls[0][0] === 'Test error', 'Error message should match');
                        }
                    }
                ]
            },
            
            error: {
                name: 'Phase 5: Error Handling',
                tests: [
                    {
                        name: 'Should handle network fetch failure',
                        test: async function() {
                            // Setup
                            resetMocks();
                            mockObjects.document.getElementById.mockReturnValue = { value: '2025-07-31' };
                            mockObjects.fetch.mockRejectedValue(new Error('Failed to fetch'));
                            
                            // Execute & Assert
                            try {
                                await loadMethodAnalysis();
                                throw new Error('Should have thrown an error');
                            } catch (error) {
                                assert(mockObjects.hideLoading.callCount === 1, 'hideLoading should be called');
                                assert(mockObjects.showError.callCount === 1, 'showError should be called');
                                assert(mockObjects.showError.calls[0][0] === 'Không thể kết nối đến server', 'Error message should be correct');
                            }
                        }
                    }
                ]
            }
        };
        
        // Test execution functions
        async function runAllTests() {
            logToConsole('🚀 Starting all tests...');
            testStats = { total: 0, passed: 0, failed: 0, pending: 0, startTime: Date.now(), endTime: 0 };
            testResults = [];
            
            clearResults();
            
            for (const [phaseKey, suite] of Object.entries(testSuites)) {
                await runTestSuite(suite);
            }
            
            testStats.endTime = Date.now();
            updateStats();
            logToConsole(`✅ All tests completed in ${testStats.endTime - testStats.startTime}ms`);
        }
        
        async function runPhaseTests(phase) {
            if (testSuites[phase]) {
                logToConsole(`🚀 Running ${phase} tests...`);
                testStats = { total: 0, passed: 0, failed: 0, pending: 0, startTime: Date.now(), endTime: 0 };
                testResults = [];
                
                clearResults();
                await runTestSuite(testSuites[phase]);
                
                testStats.endTime = Date.now();
                updateStats();
            }
        }
        
        async function runTestSuite(suite) {
            addTestSuiteHeader(suite.name);
            
            for (const testCase of suite.tests) {
                testStats.total++;
                updateProgress();
                
                try {
                    await testCase.test();
                    testStats.passed++;
                    addTestResult(testCase.name, 'pass');
                    logToConsole(`✅ ${testCase.name}`);
                } catch (error) {
                    testStats.failed++;
                    addTestResult(testCase.name, 'fail', error.message);
                    logToConsole(`❌ ${testCase.name}: ${error.message}`);
                }
                
                updateStats();
            }
        }
        
        // Utility functions
        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }
        
        function resetMocks() {
            Object.values(mockObjects).forEach(mock => {
                if (typeof mock === 'object') {
                    Object.values(mock).forEach(nestedMock => {
                        if (nestedMock.reset) nestedMock.reset();
                    });
                } else if (mock.reset) {
                    mock.reset();
                }
            });
            
            window.currentAnalysisDate = null;
            window.lowRiskMethodsData = [];
            
            updateMockStatus();
        }
        
        function updateMockStatus() {
            const statusElement = document.getElementById('mockStatus');
            statusElement.innerHTML = `
                <div>showError: ${mockObjects.showError.callCount} calls</div>
                <div>showLoading: ${mockObjects.showLoading.callCount} calls</div>
                <div>hideLoading: ${mockObjects.hideLoading.callCount} calls</div>
                <div>fetch: ${mockObjects.fetch.callCount} calls</div>
                <div>currentAnalysisDate: ${window.currentAnalysisDate || 'null'}</div>
            `;
        }
        
        function updateStats() {
            document.getElementById('totalTests').textContent = testStats.total;
            document.getElementById('passedTests').textContent = testStats.passed;
            document.getElementById('failedTests').textContent = testStats.failed;
            
            if (testStats.endTime) {
                document.getElementById('testDuration').textContent = `${testStats.endTime - testStats.startTime}ms`;
            }
            
            updateMockStatus();
        }
        
        function updateProgress() {
            const percentage = testStats.total > 0 ? Math.round(((testStats.passed + testStats.failed) / testStats.total) * 100) : 0;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
            progressBar.setAttribute('aria-valuenow', percentage);
        }
        
        function addTestSuiteHeader(suiteName) {
            const resultsContainer = document.getElementById('testResults');
            const header = document.createElement('div');
            header.className = 'test-suite-header';
            header.textContent = suiteName;
            resultsContainer.appendChild(header);
        }
        
        function addTestResult(testName, status, errorMessage = '') {
            const resultsContainer = document.getElementById('testResults');
            const result = document.createElement('div');
            result.className = `test-result test-${status}`;
            
            let icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⏳';
            result.innerHTML = `${icon} ${testName}`;
            
            if (errorMessage) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-details';
                errorDiv.textContent = errorMessage;
                result.appendChild(errorDiv);
            }
            
            resultsContainer.appendChild(result);
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function logToConsole(message) {
            const consoleLog = document.getElementById('consoleLog');
            const timestamp = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('consoleLog').innerHTML = '';
            
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            progressBar.setAttribute('aria-valuenow', 0);
        }
        
        function exportResults() {
            const results = {
                timestamp: new Date().toISOString(),
                stats: testStats,
                tests: testResults,
                mockStatus: {
                    showError: mockObjects.showError.calls,
                    showLoading: mockObjects.showLoading.calls,
                    hideLoading: mockObjects.hideLoading.calls,
                    fetch: mockObjects.fetch.calls
                }
            };
            
            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `loadMethodAnalysis-test-results-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            logToConsole('📊 Test results exported');
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeTestEnvironment();
            logToConsole('🎯 Test runner ready. Click "Run All Tests" to start.');
        });
    </script>
</body>
</html>
